[workspace]

[package]
name = "timeless-metrics-api"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
bytes = "1"
form_urlencoded = "1"
fs2 = "0.4"
regex = { version = "1", default-features = false, features = ["std", "perf"] }
rusqlite = { version = "0.40.1", features = ["bundled", "load_extension"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
