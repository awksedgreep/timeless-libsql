[package]
name = "timeless-traces-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
flate2 = "1"
fs2 = "0.4"
prost = "0.14"
rusqlite = { version = "0.40.1", features = ["bundled", "hooks", "load_extension"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
timeless-api-common = { path = "../timeless-api-common" }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
