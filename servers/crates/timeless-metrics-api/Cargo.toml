[package]
name = "timeless-metrics-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
axum = "0.8"
bytes = "1"
form_urlencoded = "1"
fs2 = "0.4"
futures-executor = "0.3"
http = "1"
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"] }
opentelemetry-http = { version = "0.32.0", default-features = false }
# No built-in HTTP client feature: the exporter transport is this crate's own
# reqwest (TLS roots, headers, timeouts configured in telemetry.rs), so the
# binary carries one HTTP stack instead of two.
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "trace"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["trace"] }
regex = { version = "1", default-features = false, features = ["std", "perf"] }
promql-parser = "=0.10.0"
chrono = { version = "0.4", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.40.1", features = ["bundled", "hooks", "load_extension"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
timeless-api-common = { path = "../timeless-api-common" }

[dev-dependencies]
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["testing", "trace"] }
tempfile = "3"
timeless-traces-api = { path = "../timeless-traces-api" }
tower = { version = "0.5", features = ["util"] }
