[package]
name = "timeless-metrics-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
axum = "0.8"
bytes = "1"
form_urlencoded = "1"
fs2 = "0.4"
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["trace"] }
regex = { version = "1", default-features = false, features = ["std", "perf"] }
promql-parser = "=0.10.0"
chrono = { version = "0.4", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.40.1", features = ["bundled", "hooks", "load_extension"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
timeless-api-common = { path = "../timeless-api-common" }

[dev-dependencies]
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["testing", "trace"] }
tempfile = "3"
timeless-traces-api = { path = "../timeless-traces-api" }
tower = { version = "0.5", features = ["util"] }
