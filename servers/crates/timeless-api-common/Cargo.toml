[package]
name = "timeless-api-common"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
ed25519-dalek = "2"
subtle = "2"
form_urlencoded = "1"
fs2 = "0.4"
rusqlite = { version = "0.40.1", features = ["backup"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "signal", "sync", "time"] }

[dev-dependencies]
timeless-authctl = { path = "../timeless-authctl" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
