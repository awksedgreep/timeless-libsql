[package]
name = "timeless-api-common"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
ed25519-dalek = "2"
subtle = "2"
form_urlencoded = "1"
fs2 = "0.4"
futures-executor = "0.3"
http = "1"
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"] }
opentelemetry-http = { version = "0.32.0", default-features = false }
# No built-in HTTP client feature: the OTLP transport is this crate's own
# reqwest (TLS roots, headers, timeouts configured in otel.rs), so the servers
# carry one HTTP stack instead of two.
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "trace"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["trace"] }
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.40.1", features = ["backup"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "signal", "sync", "time"] }

[dev-dependencies]
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["testing", "trace"] }
timeless-authctl = { path = "../timeless-authctl" }
tempfile = "3"
tokio = { version = "1", features = ["net", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
