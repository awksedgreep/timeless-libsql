[package]
name = "timeless-api-common"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
fs2 = "0.4"
rusqlite = "0.40.1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "signal", "sync", "time"] }
