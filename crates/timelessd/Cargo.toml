[workspace]

[package]
name = "timelessd"
version = "0.3.0"
edition = "2021"
license = "MIT"

[dependencies]
axum = "0.8"
rusqlite = { version = "0.40.1", features = ["bundled", "load_extension"] }
serde_json = "1"
timeless-api = { path = "../timeless-api" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
