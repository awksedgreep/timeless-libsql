[workspace]

[package]
name = "timeless-release-tool"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
# The release tool must provide the SQLite load-extension API itself. Apple's
# system SQLite deliberately omits those symbols, which made the v0.4.0
# x86-64 and AArch64 macOS artifact jobs fail before archive creation.
rusqlite = { version = "0.40", features = ["bundled", "load_extension"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = "0.9"
