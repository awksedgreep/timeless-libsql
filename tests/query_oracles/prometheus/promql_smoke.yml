rule_files: []
evaluation_interval: 10s

tests:
  - interval: 10s
    input_series:
      - series: 'query_contract_cpu{host="a"}'
        values: '10 20 30'
      - series: 'query_contract_cpu{host="b"}'
        values: '80 _ 100'
      - series: 'query_contract_memory{host="a",job="api"}'
        values: '40 50 60'
      - series: 'query_contract_queue{host="b",job="api"}'
        values: '4 5 6'
      - series: 'query_contract_database{host="c",job="db"}'
        values: '7 8 9'
      - series: 'query_contract_temporal{host="t"}'
        values: '1 2 3 4 5 6 7'
      - series: 'query_contract_arithmetic_lhs{host="a",zone="east"}'
        values: '8 9 10'
      - series: 'query_contract_arithmetic_lhs{host="b",zone="west"}'
        values: '10 11 12'
      - series: 'query_contract_arithmetic_lhs{host="c",zone="north"}'
        values: '12 13 14'
      - series: 'query_contract_arithmetic_rhs{host="a",zone="east"}'
        values: '2 3 4'
      - series: 'query_contract_arithmetic_rhs{host="b",zone="west"}'
        values: '5 6 7'
      - series: 'query_contract_arithmetic_rhs{host="d",zone="south"}'
        values: '4 5 6'
      - series: 'query_contract_arithmetic_rhs_duplicate{host="a",zone="east"}'
        values: '3 4 5'
      - series: 'query_contract_matching_lhs{host="a",shared="x",zone="east"}'
        values: '6 7 8'
      - series: 'query_contract_matching_rhs{host="a",shared="x",zone="west"}'
        values: '1 2 3'
      - series: 'query_contract_group_many_lhs{host="a",owner="old",pod="p1",zone="east"}'
        values: '6 7 8'
      - series: 'query_contract_group_many_lhs{host="a",owner="old",pod="p2",zone="west"}'
        values: '7 8 9'
      - series: 'query_contract_group_one_rhs{host="a",team="core"}'
        values: '1 2 3'
      - series: 'query_contract_group_one_lhs{host="a",team="core"}'
        values: '6 7 8'
      - series: 'query_contract_group_many_rhs{host="a",pod="p1",zone="east"}'
        values: '1 2 3'
      - series: 'query_contract_group_many_rhs{host="a",pod="p2",zone="west"}'
        values: '2 3 4'
      - series: 'query_contract_aggregation{host="a",region="east"}'
        values: '1 2 3'
      - series: 'query_contract_aggregation{host="b",region="east"}'
        values: '2 3 4'
      - series: 'query_contract_aggregation{host="c",region="west"}'
        values: '5 5 6'
      - series: 'query_contract_avg_precision{host="a"}'
        values: '1e16 1e16 1e16'
      - series: 'query_contract_avg_precision{host="b"}'
        values: '1 1 1'
      - series: 'query_contract_avg_precision{host="c"}'
        values: '-1e16 -1e16 -1e16'
    promql_expr_test:
      - expr: 'query_contract_cpu{host="a"}'
        eval_time: 20s
        exp_samples:
          - labels: 'query_contract_cpu{host="a"}'
            value: 30
      - expr: 'avg_over_time(query_contract_cpu{host="a"}[20s])'
        eval_time: 20s
        exp_samples:
          - labels: '{host="a"}'
            value: 25
      - expr: 'avg_over_time(query_contract_cpu{host="a"}[10s500ms])'
        eval_time: 20s
        exp_samples:
          - labels: '{host="a"}'
            value: 25
      - expr: '{job="api"}'
        eval_time: 20s
        exp_samples:
          - labels: 'query_contract_memory{host="a",job="api"}'
            value: 60
          - labels: 'query_contract_queue{host="b",job="api"}'
            value: 6
      - expr: '{job="api",region=""}'
        eval_time: 20s
        exp_samples:
          - labels: 'query_contract_memory{host="a",job="api"}'
            value: 60
          - labels: 'query_contract_queue{host="b",job="api"}'
            value: 6
      - expr: 'avg_over_time({job="api"}[20s])'
        eval_time: 20s
        exp_samples:
          - labels: '{host="a",job="api"}'
            value: 55
          - labels: '{host="b",job="api"}'
            value: 5.5
      - expr: '{__name__=~"query_contract_(memory|queue)",job="api"}'
        eval_time: 20s
        exp_samples:
          - labels: 'query_contract_memory{host="a",job="api"}'
            value: 60
          - labels: 'query_contract_queue{host="b",job="api"}'
            value: 6
      - expr: '{__name__!="query_contract_queue",job="api"}'
        eval_time: 20s
        exp_samples:
          - labels: 'query_contract_memory{host="a",job="api"}'
            value: 60
      - expr: '{__name__=~"query_contract_.*",__name__!~"query_contract_queue",job="api"}'
        eval_time: 20s
        exp_samples:
          - labels: 'query_contract_memory{host="a",job="api"}'
            value: 60
      - expr: 'query_contract_temporal offset 20s'
        eval_time: 60s
        exp_samples:
          - labels: 'query_contract_temporal{host="t"}'
            value: 5
      - expr: 'query_contract_temporal offset -20s'
        eval_time: 20s
        exp_samples:
          - labels: 'query_contract_temporal{host="t"}'
            value: 5
      - expr: 'query_contract_temporal @ 40'
        eval_time: 60s
        exp_samples:
          - labels: 'query_contract_temporal{host="t"}'
            value: 5
      - expr: 'query_contract_temporal @ 50 offset 10s'
        eval_time: 60s
        exp_samples:
          - labels: 'query_contract_temporal{host="t"}'
            value: 5
      - expr: 'avg_over_time(query_contract_temporal[20s] @ 50 offset 10s)'
        eval_time: 60s
        exp_samples:
          - labels: '{host="t"}'
            value: 4.5
      - expr: 'avg_over_time(query_contract_temporal[20s:10s])'
        eval_time: 60s
        exp_samples:
          - labels: '{host="t"}'
            value: 6.5
      - expr: 'avg_over_time(query_contract_temporal[20s:10s] offset 10s)'
        eval_time: 60s
        exp_samples:
          - labels: '{host="t"}'
            value: 5.5
      - expr: 'avg_over_time(avg_over_time(query_contract_temporal[20s:10s])[20s:10s])'
        eval_time: 60s
        exp_samples:
          - labels: '{host="t"}'
            value: 6
      - expr: '-query_contract_temporal'
        eval_time: 60s
        exp_samples:
          - labels: '{host="t"}'
            value: -7
      - expr: '-avg_over_time(query_contract_temporal[20s])'
        eval_time: 60s
        exp_samples:
          - labels: '{host="t"}'
            value: -6.5
      - expr: 'avg_over_time((-query_contract_temporal)[20s:10s])'
        eval_time: 60s
        exp_samples:
          - labels: '{host="t"}'
            value: -6.5
      - expr: '-(-query_contract_temporal)'
        eval_time: 60s
        exp_samples:
          - labels: '{host="t"}'
            value: 7
      - expr: 'query_contract_arithmetic_lhs + query_contract_arithmetic_rhs'
        eval_time: 20s
        exp_samples:
          - labels: '{host="a",zone="east"}'
            value: 14
          - labels: '{host="b",zone="west"}'
            value: 19
      - expr: '20 - query_contract_arithmetic_lhs{host="a"}'
        eval_time: 20s
        exp_samples:
          - labels: '{host="a",zone="east"}'
            value: 10
      - expr: 'query_contract_arithmetic_lhs{host="a"} ^ 2'
        eval_time: 20s
        exp_samples:
          - labels: '{host="a",zone="east"}'
            value: 100
      - expr: 'query_contract_arithmetic_lhs > 11'
        eval_time: 20s
        exp_samples:
          - labels: 'query_contract_arithmetic_lhs{host="b",zone="west"}'
            value: 12
          - labels: 'query_contract_arithmetic_lhs{host="c",zone="north"}'
            value: 14
      - expr: 'query_contract_arithmetic_lhs > bool 11'
        eval_time: 20s
        exp_samples:
          - labels: '{host="a",zone="east"}'
            value: 0
          - labels: '{host="b",zone="west"}'
            value: 1
          - labels: '{host="c",zone="north"}'
            value: 1
      - expr: 'query_contract_arithmetic_lhs == query_contract_arithmetic_rhs'
        eval_time: 20s
        exp_samples: []
      - expr: 'query_contract_arithmetic_lhs > bool query_contract_arithmetic_rhs'
        eval_time: 20s
        exp_samples:
          - labels: '{host="a",zone="east"}'
            value: 1
          - labels: '{host="b",zone="west"}'
            value: 1
      - expr: 'query_contract_arithmetic_lhs and query_contract_arithmetic_rhs'
        eval_time: 20s
        exp_samples:
          - labels: 'query_contract_arithmetic_lhs{host="a",zone="east"}'
            value: 10
          - labels: 'query_contract_arithmetic_lhs{host="b",zone="west"}'
            value: 12
      - expr: 'query_contract_arithmetic_lhs unless query_contract_arithmetic_rhs'
        eval_time: 20s
        exp_samples:
          - labels: 'query_contract_arithmetic_lhs{host="c",zone="north"}'
            value: 14
      - expr: 'query_contract_arithmetic_lhs or query_contract_arithmetic_rhs'
        eval_time: 20s
        exp_samples:
          - labels: 'query_contract_arithmetic_lhs{host="a",zone="east"}'
            value: 10
          - labels: 'query_contract_arithmetic_lhs{host="b",zone="west"}'
            value: 12
          - labels: 'query_contract_arithmetic_lhs{host="c",zone="north"}'
            value: 14
          - labels: 'query_contract_arithmetic_rhs{host="d",zone="south"}'
            value: 6
      - expr: 'query_contract_arithmetic_lhs and {__name__=~"query_contract_arithmetic_rhs(_duplicate)?"}'
        eval_time: 20s
        exp_samples:
          - labels: 'query_contract_arithmetic_lhs{host="a",zone="east"}'
            value: 10
          - labels: 'query_contract_arithmetic_lhs{host="b",zone="west"}'
            value: 12
      - expr: 'query_contract_matching_lhs + on(host) query_contract_matching_rhs'
        eval_time: 20s
        exp_samples:
          - labels: '{host="a"}'
            value: 11
      - expr: 'query_contract_matching_lhs + ignoring(zone) query_contract_matching_rhs'
        eval_time: 20s
        exp_samples:
          - labels: '{host="a",shared="x"}'
            value: 11
      - expr: 'query_contract_matching_lhs == on(host) query_contract_matching_lhs'
        eval_time: 20s
        exp_samples:
          - labels: '{host="a"}'
            value: 8
      - expr: 'query_contract_matching_lhs and on(host) query_contract_matching_rhs'
        eval_time: 20s
        exp_samples:
          - labels: 'query_contract_matching_lhs{host="a",shared="x",zone="east"}'
            value: 8
      - expr: 'query_contract_matching_lhs + on(missing) query_contract_matching_rhs'
        eval_time: 20s
        exp_samples:
          - labels: '{}'
            value: 11
      - expr: 'query_contract_matching_lhs + on() query_contract_matching_rhs'
        eval_time: 20s
        exp_samples:
          - labels: '{}'
            value: 11
      - expr: 'query_contract_group_many_lhs + on(host) group_left(team) query_contract_group_one_rhs'
        eval_time: 20s
        exp_samples:
          - labels: '{host="a",owner="old",pod="p1",team="core",zone="east"}'
            value: 11
          - labels: '{host="a",owner="old",pod="p2",team="core",zone="west"}'
            value: 12
      - expr: 'query_contract_group_many_lhs + on(host) group_left(owner) query_contract_group_one_rhs'
        eval_time: 20s
        exp_samples:
          - labels: '{host="a",pod="p1",zone="east"}'
            value: 11
          - labels: '{host="a",pod="p2",zone="west"}'
            value: 12
      - expr: 'query_contract_group_one_lhs - on(host) group_right(team) query_contract_group_many_rhs'
        eval_time: 20s
        exp_samples:
          - labels: '{host="a",pod="p1",team="core",zone="east"}'
            value: 5
          - labels: '{host="a",pod="p2",team="core",zone="west"}'
            value: 4
      - expr: 'query_contract_group_one_lhs > on(host) group_right(team) query_contract_group_many_rhs'
        eval_time: 20s
        exp_samples:
          - labels: 'query_contract_group_many_rhs{host="a",pod="p1",team="core",zone="east"}'
            value: 8
          - labels: 'query_contract_group_many_rhs{host="a",pod="p2",team="core",zone="west"}'
            value: 8
      - expr: 'sum by (region) (query_contract_aggregation)'
        eval_time: 20s
        exp_samples:
          - labels: '{region="east"}'
            value: 7
          - labels: '{region="west"}'
            value: 6
      - expr: 'sum without (__name__, host) (query_contract_aggregation)'
        eval_time: 20s
        exp_samples:
          - labels: '{region="east"}'
            value: 7
          - labels: '{region="west"}'
            value: 6
      - expr: 'sum(query_contract_aggregation)'
        eval_time: 20s
        exp_samples:
          - labels: '{}'
            value: 13
      - expr: 'sum by (__name__) (query_contract_aggregation)'
        eval_time: 20s
        exp_samples:
          - labels: 'query_contract_aggregation'
            value: 13
      - expr: 'avg by (region) (query_contract_aggregation)'
        eval_time: 20s
        exp_samples:
          - labels: '{region="east"}'
            value: 3.5
          - labels: '{region="west"}'
            value: 6
      - expr: 'avg(query_contract_avg_precision)'
        eval_time: 20s
        exp_samples:
          - labels: '{}'
            value: 0.3333333333333333
      - expr: 'min by (region) (query_contract_aggregation)'
        eval_time: 20s
        exp_samples:
          - labels: '{region="east"}'
            value: 3
          - labels: '{region="west"}'
            value: 6
      - expr: 'max by (region) (query_contract_aggregation)'
        eval_time: 20s
        exp_samples:
          - labels: '{region="east"}'
            value: 4
          - labels: '{region="west"}'
            value: 6
      - expr: 'count by (region) (query_contract_aggregation)'
        eval_time: 20s
        exp_samples:
          - labels: '{region="east"}'
            value: 2
          - labels: '{region="west"}'
            value: 1
      - expr: 'group without (__name__, host) (query_contract_aggregation)'
        eval_time: 20s
        exp_samples:
          - labels: '{region="east"}'
            value: 1
          - labels: '{region="west"}'
            value: 1
